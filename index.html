
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYLOVE 💗</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  background: #08010c;
  font-family: Arial, sans-serif;
}
canvas { display: block; }
#title {
  position: fixed;
  top: 12%;
  width: 100%;
  text-align: center;
  font-size: clamp(35px, 9vw, 76px);
  font-weight: 900;
  letter-spacing: 10px;
  color: #fff0fb;
  text-shadow: 0 0 8px #fff, 0 0 20px #ff3eb5,
               0 0 45px #ff1493, 0 0 80px #ff1493;
  animation: glow 1.8s ease-in-out infinite alternate;
  pointer-events: none;
}
#sub {
  position: fixed;
  top: calc(12% + 85px);
  width: 100%;
  text-align: center;
  color: #ff9cde;
  font-size: 12px;
  letter-spacing: 5px;
  text-shadow: 0 0 12px #ff1493;
  pointer-events: none;
}
@keyframes glow {
  from { opacity: .75; transform: scale(.98); }
  to { opacity: 1; transform: scale(1.03); }
}
#hint {
  position: fixed;
  bottom: 7%;
  width: 100%;
  text-align: center;
  color: #ffb6e6;
  font-size: 12px;
  letter-spacing: 3px;
  opacity: .8;
  pointer-events: none;
}
</style>
</head>
<body>
<div id="title">MYLOVE</div>
<div id="sub">♥ YOU ARE MY UNIVERSE ♥</div>
<div id="hint">TOUCH THE SCREEN ✨</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08010c);
scene.fog = new THREE.FogExp2(0x08010c, 0.018);

const camera = new THREE.PerspectiveCamera(
  55, innerWidth / innerHeight, 0.1, 1000
);
camera.position.set(0, 0, 18);

const renderer = new THREE.WebGLRenderer({
  antialias: true, alpha: false
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.5;
document.body.appendChild(renderer.domElement);

// Ánh sáng
scene.add(new THREE.AmbientLight(0xffaadd, 2));

function light(color, intensity, x, y, z) {
  const l = new THREE.PointLight(color, intensity, 50);
  l.position.set(x, y, z);
  scene.add(l);
}
light(0xff1493, 100, 4, 3, 6);
light(0xff69d4, 90, -5, -2, 4);
light(0xffffff, 50, 0, 5, 8);

// Tạo hình trái tim 3D từ hình dạng 2D đùn chiều sâu
const shape = new THREE.Shape();
shape.moveTo(0, -1.4);
shape.bezierCurveTo(-0.3, -0.8, -2.1, 0.3, -1.8, 1.25);
shape.bezierCurveTo(-1.6, 2.1, -0.45, 2.1, 0, 1.25);
shape.bezierCurveTo(0.45, 2.1, 1.6, 2.1, 1.8, 1.25);
shape.bezierCurveTo(2.1, 0.3, 0.3, -0.8, 0, -1.4);

const geometry = new THREE.ExtrudeGeometry(shape, {
  depth: 0.8,
  bevelEnabled: true,
  bevelSegments: 5,
  steps: 2,
  bevelSize: 0.13,
  bevelThickness: 0.13,
  curveSegments: 24
});
geometry.center();

const heartMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xff168e,
  emissive: 0xe90072,
  emissiveIntensity: 0.65,
  metalness: 0.25,
  roughness: 0.19,
  clearcoat: 1,
  clearcoatRoughness: 0.08
});

const heart = new THREE.Mesh(geometry, heartMaterial);
heart.scale.set(1.25, 1.25, 1.25);
scene.add(heart);

// Viền trái tim neon
const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(geometry, 20),
  new THREE.LineBasicMaterial({
    color: 0xffb9ec,
    transparent: true,
    opacity: 0.75
  })
);
heart.add(edges);

// Những trái tim nhỏ 3D
const miniShape = new THREE.Shape();
miniShape.moveTo(0, -0.3);
miniShape.bezierCurveTo(-0.15, -0.05, -0.55, 0.18, -0.4, 0.42);
miniShape.bezierCurveTo(-0.3, 0.62, -0.08, 0.52, 0, 0.37);
miniShape.bezierCurveTo(0.08, 0.52, 0.3, 0.62, 0.4, 0.42);
miniShape.bezierCurveTo(0.55, 0.18, 0.15, -0.05, 0, -0.3);

const miniGeo = new THREE.ExtrudeGeometry(miniShape, {
  depth: 0.12, bevelEnabled: true,
  bevelSegments: 2, bevelSize: 0.035,
  bevelThickness: 0.035, steps: 1
});

const particles = [];
const colors = [0xff3ca6, 0xff83d2, 0xffb9ed, 0xffffff];

for (let i = 0; i < 220; i++) {
  const mat = new THREE.MeshBasicMaterial({
    color: colors[Math.floor(Math.random() * colors.length)],
    transparent: true,
    opacity: 0.9
  });

  const obj = new THREE.Mesh(miniGeo, mat);
  const s = 0.25 + Math.random() * 0.65;
  obj.scale.setScalar(s);

  const angle = Math.random() * Math.PI * 2;
  const radius = 2.5 + Math.random() * 9;

  obj.userData = {
    angle,
    radius,
    speed: 0.15 + Math.random() * 0.6,
    y: (Math.random() - 0.5) * 12,
    phase: Math.random() * Math.PI * 2,
    size: s
  };

  obj.position.set(
    Math.cos(angle) * radius,
    obj.userData.y,
    (Math.random() - 0.5) * 12
  );

  scene.add(obj);
  particles.push(obj);
}

// Sao phát sáng dạng điểm
const starCount = 1000;
const starPositions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  starPositions[i * 3] = (Math.random() - 0.5) * 45;
  starPositions[i * 3 + 1] = (Math.random() - 0.5) * 30;
  starPositions[i * 3 + 2] = (Math.random() - 0.5) * 35;
}

const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position',
  new THREE.BufferAttribute(starPositions, 3));

const stars = new THREE.Points(starGeo,
  new THREE.PointsMaterial({
    color: 0xff9cde, size: 0.055,
    transparent: true, opacity: 0.85
  })
);
scene.add(stars);

// Hiệu ứng nhấn màn hình: trái tim bung tỏa
let burst = 0;
addEventListener('pointerdown', () => { burst = 1; });

let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.012;
  burst *= 0.94;

  heart.rotation.y = t * 0.8;
  heart.rotation.x = Math.sin(t * 0.6) * 0.17;
  heart.rotation.z = Math.sin(t * 0.4) * 0.08;

  const beat = 1 + 0.06 * Math.sin(t * 3);
  heart.scale.setScalar(1.25 * beat * (1 + burst * 0.25));

  particles.forEach(p => {
    const d = p.userData;
    d.angle += 0.003 * d.speed;
    d.radius += 0.003 + burst * 0.08;

    if (d.radius > 12) d.radius = 2.5;

    p.position.x = Math.cos(d.angle) * d.radius;
    p.position.z = Math.sin(d.angle) * d.radius;
    p.position.y = d.y + Math.sin(t * 2 + d.phase) * 0.4;
    p.rotation.y += 0.018;
    p.rotation.z = Math.sin(t + d.phase) * 0.25;
  });

  stars.rotation.y = t * 0.012;
  camera.position.x = Math.sin(t * 0.2) * 0.35;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
