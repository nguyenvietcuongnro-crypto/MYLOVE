<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Một câu hỏi dành cho cậu 💗</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #ffe0ec, #fff0f5, #ffd6e7);
  color: #d6336c;
}

/* Trái tim bay */
#hearts {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.heart {
  position: absolute;
  bottom: -60px;
  color: #ff4d88;
  opacity: 0.8;
  animation: fly linear infinite;
  filter: drop-shadow(0 0 8px #ff9abb);
  user-select: none;
}

@keyframes fly {
  0% {
    transform: translateY(0) rotate(0deg) scale(0.7);
    opacity: 0;
  }
  10% {
    opacity: 0.85;
  }
  90% {
    opacity: 0.75;
  }
  100% {
    transform: translateY(-120vh) rotate(360deg) scale(1.3);
    opacity: 0;
  }
}

/* Nội dung chính */
.container {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 15vh 18px 30px;
  text-align: center;
}

h1 {
  font-size: clamp(25px, 5vw, 42px);
  margin: 0 0 12px;
  text-shadow: 0 3px 12px #ffb6ce;
}

.subtitle {
  color: #b84b70;
  font-size: 16px;
  margin-bottom: 35px;
}

.buttons {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  flex-wrap: wrap;
  width: 100%;
}

button {
  border: none;
  cursor: pointer;
  font-size: 18px;
  font-weight: bold;
  transition: transform 0.2s, box-shadow 0.2s;
  -webkit-tap-highlight-color: transparent;
}

#yes {
  width: 110px;
  height: 100px;
  background: #ff477e;
  color: white;
  clip-path: polygon(
    50% 95%, 10% 58%, 0% 35%, 5% 15%,
    22% 5%, 39% 12%, 50% 26%,
    61% 12%, 78% 5%, 95% 15%,
    100% 35%, 90% 58%
  );
  filter: drop-shadow(0 5px 8px #ff8fb2);
}

#yes:hover {
  transform: scale(1.12);
}

#no {
  background: white;
  color: #e05280;
  border: 2px solid #ff9fbd;
  border-radius: 18px;
  padding: 15px 23px;
  box-shadow: 0 5px 15px #ffb6ce;
  touch-action: manipulation;
}

/* Lá thư */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #ffdeebbb;
  backdrop-filter: blur(6px);
}

.overlay.show {
  display: flex;
}

.letter {
  position: relative;
  width: min(380px, 100%);
  padding: 35px 24px;
  background: #fffafc;
  border: 2px solid #ffc0d5;
  border-radius: 24px;
  box-shadow: 0 15px 50px #d94c7c44;
  animation: openLetter 0.55s ease;
}

@keyframes openLetter {
  from {
    opacity: 0;
    transform: translateY(30px) scale(0.8);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.envelope-heart {
  font-size: 50px;
  margin-bottom: 10px;
  animation: beat 0.8s infinite alternate;
}

@keyframes beat {
  to { transform: scale(1.15); }
}

#letterText {
  font-size: 25px;
  font-weight: bold;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.close {
  margin-top: 20px;
  padding: 10px 22px;
  color: white;
  background: #ff6294;
  border-radius: 20px;
}

@media (max-width: 480px) {
  .container {
    padding-top: 17vh;
  }

  .subtitle {
    margin-bottom: 30px;
  }

  .buttons {
    gap: 18px;
  }

  #yes {
    width: 100px;
    height: 92px;
  }
}
#result {
  margin-top: 28px;
  padding: 12px 22px;
  border-radius: 18px;
  background: #ffffffbb;
  color: #d6336c;
  font-size: 19px;
  font-weight: bold;
  box-shadow: 0 4px 18px #ff9abb55;
  opacity: 0;
  transform: translateY(10px);
  transition: 0.35s ease;
}

#result.show {
  opacity: 1;
  transform: translateY(0);
}
</style>
</head>

<body>

<div id="hearts"></div>

<main class="container">
  <h1>Cậu có thích chơi với tớ không? 💗</h1>
  <p class="subtitle">Trả lời thật lòng nhaaa 🥺</p>

  <div class="buttons">
    <button id="yes" aria-label="CÓ">CÓ,SIÊU BẠN THÂN 💗</button>
    <button id="no">Bạn bè 😊</button>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="letter">
    <div class="envelope-heart">💌</div>
    <div id="letterText"></div>
    <button class="close" id="close">Đóng thư 💕</button>
  </div>
</div>

<script>
const hearts = document.getElementById("hearts");
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const overlay = document.getElementById("overlay");
const letterText = document.getElementById("letterText");
const close = document.getElementById("close");

// Tạo trái tim bay liên tục
function createHeart() {
  const heart = document.createElement("span");
  heart.className = "heart";
  heart.textContent = ["♥", "♡", "💗", "💕", "💖"][
    Math.floor(Math.random() * 5)
  ];

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (14 + Math.random() * 28) + "px";
  heart.style.animationDuration = (5 + Math.random() * 7) + "s";
  heart.style.animationDelay = (Math.random() * 1.5) + "s";

  hearts.appendChild(heart);
  heart.addEventListener("animationend", () => heart.remove());
}

for (let i = 0; i < 30; i++) {
  setTimeout(createHeart, i * 180);
}
setInterval(createHeart, 350);

// Mở lá thư
function showLetter(message) {
  letterText.textContent = message;
  overlay.classList.add("show");
}

yes.addEventListener("click", () => {
  showLetter("Mãi yêuuuuu, chúc cậu ngày mới tốt lành 💗💗💗");
});

// Nút Bạn bè né chuột trên máy tính
function moveButton() {
  const margin = 12;
  const maxX = Math.max(margin, window.innerWidth - no.offsetWidth - margin);
  const maxY = Math.max(margin, window.innerHeight - no.offsetHeight - margin);

  no.style.position = "fixed";
  no.style.left = margin + Math.random() * (maxX - margin) + "px";
  no.style.top = margin + Math.random() * (maxY - margin) + "px";
  no.style.zIndex = "5";
}

// Chỉ né khi dùng chuột thật, không áp dụng với màn hình cảm ứng
no.addEventListener("mouseenter", (event) => {
  if (event.pointerType === "touch") return;
  moveButton();
});

// Bắt cả trường hợp con trỏ sắp chạm vào nút
no.addEventListener("pointerenter", (event) => {
  if (event.pointerType === "mouse") moveButton();
});

// Điện thoại vẫn có thể bấm Bạn bè
no.addEventListener("click", () => {
  showLetter("Được lắm, chúc cậu ngày mới tốt lành♥️");
});

// Đóng thư
close.addEventListener("click", () => {
  overlay.classList.remove("show");
});

overlay.addEventListener("click", (event) => {
  if (event.target === overlay) {
    overlay.classList.remove("show");
  }
});
</script>

</body>
</html>
