<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy 20/10 💗</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  font-family: Georgia, serif;
  color: white;
  background:
    radial-gradient(ellipse at 50% 45%, #6b245c 0%, #32102f 40%,
    #130818 75%, #06030b 100%);
}
canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.page {
  position: relative;
  z-index: 1;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px 16px;
  text-align: center;
}
.brand {
  color: #ffb9e7;
  letter-spacing: 7px;
  font: bold 12px Arial, sans-serif;
  text-shadow: 0 0 16px #ff42bd;
  margin-bottom: 22px;
}
.panels {
  width: min(84vw, 390px);
  display: flex;
  gap: 16px;
  justify-content: center;
  perspective: 700px;
  margin-bottom: 30px;
}
.panel {
  position: relative;
  width: 50%;
  aspect-ratio: 1;
  border: 2px solid rgba(255,230,250,.9);
  border-radius: 30%;
  background: linear-gradient(145deg,
    rgba(255,255,255,.65), rgba(255,116,205,.22) 50%,
    rgba(255,255,255,.12));
  box-shadow: 0 0 12px #fff, 0 0 30px #ff69c9,
    inset 0 0 25px rgba(255,255,255,.65);
  animation: float 3s ease-in-out infinite;
  overflow: hidden;
}
.panel:nth-child(2) {
  animation-delay: -1.5s;
}
.panel::before {
  content: "♡";
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: clamp(50px, 12vw, 80px);
  color: rgba(255,255,255,.85);
  text-shadow: 0 0 25px #ff46b8;
  animation: heartbeat 1.5s infinite;
}
.panel::after {
  content: "";
  position: absolute;
  top: -60%;
  left: -100%;
  width: 70%;
  height: 220%;
  background: rgba(255,255,255,.4);
  transform: rotate(35deg);
  animation: shine 4s linear infinite;
}
.panel:nth-child(2)::after {
  animation-delay: -2s;
}
@keyframes float {
  0%,100% { transform: translateY(0) rotateY(-5deg); }
  50% { transform: translateY(-12px) rotateY(5deg); }
}
@keyframes heartbeat {
  0%,100% { transform: scale(.9); }
  50% { transform: scale(1.12); }
}
@keyframes shine {
  0%,20% { left: -100%; }
  70%,100% { left: 150%; }
}
h1 {
  margin: 0;
  color: #fff0fb;
  font-size: clamp(32px, 8vw, 48px);
  line-height: 1.25;
  font-style: italic;
  text-shadow: 0 0 8px white, 0 0 20px #ff54c3,
    0 0 42px #ff1493;
  animation: appear 1.2s ease both;
}
.message {
  max-width: 360px;
  margin: 18px 0 0;
  font-size: clamp(16px, 4vw, 19px);
  line-height: 1.8;
  color: #ffe1f4;
  text-shadow: 0 0 12px #ff70cb;
}
.divider {
  margin: 22px 0 14px;
  color: #ffb4e6;
  letter-spacing: 8px;
}
button {
  border: 1px solid #ffb4e6;
  border-radius: 30px;
  background: rgba(255,76,181,.15);
  color: white;
  padding: 12px 22px;
  font-size: 14px;
  box-shadow: 0 0 18px #ff42bd66;
  cursor: pointer;
  backdrop-filter: blur(8px);
}
button:active { transform: scale(.96); }
#note {
  min-height: 22px;
  margin-top: 12px;
  color: #ffc8ec;
  font-size: 13px;
}
@keyframes appear {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (max-height: 700px) {
  .page { padding: 14px; }
  .brand { margin-bottom: 12px; }
  .panels { width: min(65vw, 290px); margin-bottom: 18px; }
  .message { margin-top: 10px; line-height: 1.5; }
  .divider { margin: 12px 0; }
}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<main class="page">
  <div class="brand">♡ A LITTLE GIFT FOR YOU ♡</div>

  <div class="panels">
    <div class="panel"></div>
    <div class="panel"></div>
  </div>

  <h1>Chúc bạn<br>20/10 thật vui vẻ!</h1>

  <p class="message">
    Chúc bạn luôn mạnh khỏe, bình an,<br>
    gặp nhiều may mắn và luôn mỉm cười.<br>
    Mong mọi điều tốt đẹp sẽ đến với bạn,<br>
    hôm nay và cả những ngày sau nữa. 💗
  </p>

  <div class="divider">─── ♡ ───</div>

  <button id="wish">💌 Nhấn vào đây nhé</button>
  <div id="note">Một món quà nhỏ dành riêng cho bạn ✨</div>
</main>

<script>
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');
let w, h, particles = [], time = 0;

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  w = innerWidth; h = innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

function makeParticle(fromCenter = false) {
  const a = Math.random() * Math.PI * 2;
  const speed = fromCenter ? 1.5 + Math.random() * 4 : .3 + Math.random() * 1.2;
  return {
    x: fromCenter ? w/2 : Math.random()*w,
    y: fromCenter ? h*.48 : Math.random()*h,
    vx: Math.cos(a)*speed,
    vy: fromCenter ? Math.sin(a)*speed : -.3-Math.random()*.8,
    size: 3 + Math.random()*11,
    alpha: .4+Math.random()*.6,
    life: fromCenter ? 1 : Math.random(),
    burst: fromCenter,
    emoji: Math.random() > .25 ? '♥' : '✦'
  };
}

for(let i=0;i<70;i++) particles.push(makeParticle());

function draw() {
  time += .01;
  ctx.clearRect(0,0,w,h);

  for(const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.life += p.burst ? .012 : .002;
    p.alpha = p.burst ? Math.max(0,1-p.life) : .3+.5*Math.abs(Math.sin(time+p.x));

    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.font = ${p.size}px Georgia;
    ctx.shadowColor = '#ff46b8';
    ctx.shadowBlur = 15;
    ctx.fillStyle = Math.random() > .5 ? '#ff9bdd' : '#fff0fa';
    ctx.fillText(p.emoji,p.x,p.y);
    ctx.restore();

    if(p.burst && (p.life>=1 || p.x<0 || p.x>w || p.y<0 || p.y>h)) {
      Object.assign(p,makeParticle());
    } else if(!p.burst && (p.y < -20 || p.x < -30 || p.x > w+30)) {
      Object.assign(p,makeParticle());
    }
  }

  if(Math.random()<.08 && particles.length<140)
    particles.push(makeParticle());

  requestAnimationFrame(draw);
}
draw();

const notes = [
  'Nhớ ăn uống đầy đủ và giữ gìn sức khỏe nhé! 💗',
  'Chúc bạn mỗi ngày đều có thật nhiều niềm vui 🌸',
  'Mong bạn luôn bình an và gặp những điều tử tế ✨',
  'Chúc bạn luôn tự tin, hạnh phúc và rạng rỡ! 💕'
];
let idx = 0;
document.getElementById('wish').addEventListener('click', () => {
  document.getElementById('note').textContent = notes[idx % notes.length];
  idx++;
  for(let i=0;i<35;i++) particles.push(makeParticle(true));
});
</script>
</body>
</html>
